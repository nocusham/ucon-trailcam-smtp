# Ucon Trailcam SMTP – lokale Konfiguration
# Vorlage einmalig als config.local.toml kopieren, chmod 600 setzen.
# Bei Updates bestehende Konfiguration behalten und neue Felder manuell ergänzen.
# config.local.toml und .env werden von Git ignoriert.
# Vertrauliche Passwörter in .env hinterlegen, nicht in dieser Datei.
# Pro Kamera einen eigenen [[cameras]]-Abschnitt anlegen.

[[cameras]]
# Frei wählbarer eindeutiger Name: 1–64 Buchstaben (ASCII), Ziffern, - oder _.
name = "testkamera"

# Dauerhafte Geräte-UID aus Ucon bzw. der lokalen Ereignisdatenbank (kein App-Index).
uid = "REPLACE_WITH_CAMERA_UID"

# true = Profil für SMTP und konfigurierte Cloud-/SD-Probes aktiv.
# false = kein Versand und keine Auswahl über --config/--camera.
# Legacy-Diagnose per --index bleibt separat; der Dauerbetrieb folgt später.
enabled = true

[cameras.smtp]
# SMTP-Hostname oder IP-Adresse, ohne URL-Schema.
host = "smtp.example.invalid"

# TCP-Port (1–65535). Standard je security: 25 / 587 / 465.
port = 587

# Verschlüsselung: starttls (Standard), tls (direktes TLS/SSL), none (unverschlüsselt).
# Kein automatischer Rückfall auf unverschlüsseltes SMTP.
security = "starttls"

# Absenderadresse; genau eine E-Mail-Adresse ohne Anzeigenamen.
from = "sender@example.invalid"

# Empfängeradresse; genau eine E-Mail-Adresse. Revierwelt: pro Kamera eindeutig.
to = "recipient@example.invalid"

# SMTP-Anmeldename. Ohne SMTP-Authentifizierung leer lassen oder weglassen.
username = "sender@example.invalid"

# Name des Passworteintrags in .env (oder der vorhandenen Umgebungsvariable).
# Mehrere Kameras dürfen denselben Eintrag nutzen. Ohne Authentifizierung weglassen.
password_env = "SMTP_PASSWORD"

# Optionaler Klartext-Sonderfall: nur öffentliches Passwort "mail" für
# smtp.revierwelt.de und Empfänger @revierwelt.de. Dann password_env weglassen.
# password = "mail"

# single (Standard): genau ein Bild je E-Mail; Pflicht bei Revierwelt.
# grouped: mehrere Bilder derselben Kamera je E-Mail.
mode = "single"

# Maximale Originalbilder je Versandlauf (1–10, Standard 3), kein Download-Limit.
limit = 3

# Weitere Kamera: gesamten [[cameras]]-Block einschließlich [cameras.smtp]
# kopieren, eindeutigen Namen/UID und eigene Versandparameter setzen.
# Keine echten Zugangsdaten oder Kamera-UIDs in die öffentliche Vorlage schreiben.

# Optionaler globaler Alarmkanal (unabhängig von allen Kamera-SMTP-Profilen).
# Noch kein automatischer Dienst; zunächst nur manueller Alarm-SMTP-Test.
[alerts]
# true = Alarmkanal aktivieren, false = keine Alarm-E-Mails (Standard).
enabled = false
# Fehlerdauer in Minuten für Login-Fehler, 1–10080 (Standard 15).
login_minutes = 15
# Fehlerdauer in Minuten für Cloud-API, 1–10080 (Standard 30).
api_minutes = 30
# Wiederholt fehlgeschlagener Originaldownload eines bekannten Cloud-Ereignisses
# in Stunden, 1–720 (Standard 24). Keine zusätzlichen aktiven Erreichbarkeitsprüfungen.
# Keine Bilder allein gelten nicht als Downloadstörung.
camera_hours = 24
# Mindestabstand erfolgreicher Alarmmeldungen derselben Störung in Stunden, 1–720.
repeat_hours = 24
# Mindestabstand nach fehlgeschlagenem Alarmversand in Minuten, 1–10080.
retry_minutes = 60
# true = Entwarnung nach einer erfolgreichen Prüfung einer gemeldeten Störung.
recovery = true

[alerts.smtp]
# Eigener SMTP-Server für Fehlerberichte, möglichst unabhängig vom Bildversand.
host = "smtp.example.invalid"
# TCP-Port 1–65535; Standard 587 bei STARTTLS bzw. 465 bei TLS.
port = 587
# starttls oder tls; für Fehlerberichte ist verschlüsselter SMTP vorgeschrieben.
security = "starttls"
# Absenderadresse (genau eine E-Mail-Adresse).
from = "alerts@example.invalid"
# Privater Alarmempfänger (genau eine Adresse, kein Revierwelt-Empfänger).
to = "admin@example.invalid"
# SMTP-Benutzername; ohne Anmeldung beide folgenden Felder weglassen.
username = "alerts@example.invalid"
# Verweis auf den privaten Passworteintrag in .env.
password_env = "ALERT_SMTP_PASSWORD"
