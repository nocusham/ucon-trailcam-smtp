[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0", "packaging==26.4"]
build-backend = "setuptools.build_meta"

[project]
name = "ucon-trailcam-smtp"
version = "0.0.0.dev0"
description = "Experimental self-hosted SMTP bridge for Ucon trail cameras"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "p4p-camera-sdk==0.1.16",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "Pillow==12.3.0",
]

[project.scripts]
ucon-trailcam-smtp = "ucon_trailcam_smtp.trailcam_service:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ucon_trailcam_smtp*"]
